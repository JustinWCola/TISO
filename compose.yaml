name: tiso
services:
  backend:
    build: ./backend
    environment:
      AMAP_WEB_SERVICE_KEY: ${AMAP_WEB_SERVICE_KEY:-}
      TISO_SETTINGS_FILE: /var/lib/tiso/amap.json
      TISO_RESULTS_FILE: /var/lib/tiso/queries.sqlite3
      TISO_METRO_DIR: /var/lib/tiso/metro
      TISO_OVERPASS_URL: ${TISO_OVERPASS_URL:-}
    volumes:
      - settings:/var/lib/tiso
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/api/v1/health', timeout=2).close()"]
      interval: 5s
      timeout: 3s
      start_period: 5s
      retries: 5
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_AMAP_JS_KEY: ${VITE_AMAP_JS_KEY:-}
        VITE_AMAP_SERVICE_HOST: ${VITE_AMAP_SERVICE_HOST:-}
    depends_on:
      backend:
        condition: service_healthy
        restart: true
    ports:
      - "127.0.0.1:${TISO_PORT:-8080}:80"
    restart: unless-stopped

volumes:
  settings:
